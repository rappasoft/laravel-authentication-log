name: run-tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: [8.2, 8.3, 8.4, 8.5]
        laravel: ["11.*", "12.*", "13.*"]
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Allow known upstream advisories for Laravel 11 compatibility tests
        if: matrix.laravel == '11.*'
        run: >-
          composer config audit.ignore --json '{"PKSA-d5tc-s1qs-h781":"Laravel 11 compatibility tests only; upgrade production to patched Laravel 12 or 13.","PKSA-m5cs-t1y6-qpcs":"Laravel 11 compatibility tests only; upgrade production to patched Laravel 12 or 13.","PKSA-3r5d-mb8f-1qw9":"Laravel 11 compatibility tests only; upgrade production to patched Laravel 12 or 13.","PKSA-mdq4-51ck-6kdq":"Laravel 11 compatibility tests only; upgrade production to patched Laravel 12 or 13."}'

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
